    <script>
      // Dark is the default theme; a saved choice from the toggle wins. Runs before paint (no flash).
      (function () {
        var dark = true
        try {
          var saved = localStorage.getItem('theme')
          if (saved) dark = saved === 'dark'
        } catch (e) {}
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
